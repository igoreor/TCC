<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="570" fill="#ffffff"/>

  <!-- Linha 1: 1 -> 2 -> 3 -->
  <g>
    <rect x="40" y="30" width="330" height="180" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="205" y="80" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827"><tspan x="205">1. Identificação do</tspan><tspan x="205" dy="28">problema e motivação</tspan></text>
    <rect x="135" y="160" width="140" height="34" rx="17" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
    <text x="205" y="183" text-anchor="middle" font-size="19" fill="#0e5c66">Concluída</text>
  </g>
  <g>
    <rect x="435" y="30" width="330" height="180" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="80" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827"><tspan x="600">2. Definição dos</tspan><tspan x="600" dy="28">objetivos da solução</tspan></text>
    <rect x="530" y="160" width="140" height="34" rx="17" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
    <text x="600" y="183" text-anchor="middle" font-size="19" fill="#0e5c66">Concluída</text>
  </g>
  <g>
    <rect x="830" y="30" width="330" height="180" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="995" y="68" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827"><tspan x="995">3. Projeto e</tspan><tspan x="995" dy="28">desenvolvimento</tspan></text>
    <text x="995" y="125" text-anchor="middle" font-size="18" fill="#374151"><tspan x="995">sistema implementado;</tspan><tspan x="995" dy="22">base oficial pendente</tspan></text>
    <rect x="925" y="162" width="140" height="34" rx="17" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
    <text x="995" y="185" text-anchor="middle" font-size="19" fill="#8a5410">Parcial</text>
  </g>
  <line x1="370" y1="120" x2="433" y2="120" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="765" y1="120" x2="828" y2="120" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- 3 -> 4 -->
  <line x1="995" y1="210" x2="995" y2="298" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- Linha 2 (da direita para a esquerda): 4 -> 5 -> 6 -->
  <g>
    <rect x="830" y="300" width="330" height="180" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="995" y="348" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">4. Demonstração</text>
    <text x="995" y="382" text-anchor="middle" font-size="18" fill="#374151">uso do protótipo web</text>
    <rect x="925" y="420" width="140" height="34" rx="17" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
    <text x="995" y="443" text-anchor="middle" font-size="19" fill="#0e5c66">Concluída</text>
  </g>
  <g>
    <rect x="435" y="300" width="330" height="180" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="348" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">5. Avaliação</text>
    <rect x="465" y="372" width="270" height="34" rx="17" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
    <text x="600" y="395" text-anchor="middle" font-size="19" fill="#8a5410">Técnica: preliminar</text>
    <rect x="465" y="420" width="270" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="600" y="443" text-anchor="middle" font-size="19" fill="#4b5563">Comparativa: planejada</text>
  </g>
  <g>
    <rect x="40" y="300" width="330" height="180" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="205" y="348" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">6. Comunicação</text>
    <text x="205" y="382" text-anchor="middle" font-size="18" fill="#374151">esta monografia</text>
    <rect x="115" y="420" width="180" height="34" rx="17" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
    <text x="205" y="443" text-anchor="middle" font-size="19" fill="#8a5410">Em andamento</text>
  </g>
  <line x1="830" y1="390" x2="767" y2="390" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="435" y1="390" x2="372" y2="390" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- Iteração: 5 -> 2 -->
  <line x1="600" y1="300" x2="600" y2="213" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#seta-cinza)"/>
  <text x="612" y="262" font-size="19" font-style="italic" fill="#4b5563">iteração</text>

  <!-- Legenda -->
  <g font-size="18">
    <rect x="190" y="518" width="44" height="24" rx="12" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
    <text x="244" y="536" fill="#111827">Concluída</text>
    <rect x="410" y="518" width="44" height="24" rx="12" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
    <text x="464" y="536" fill="#111827">Parcial, preliminar ou em andamento</text>
    <rect x="850" y="518" width="44" height="24" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="904" y="536" fill="#111827">Planejada</text>
  </g>
</svg>
