<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="450" fill="#ffffff"/>

  <!-- Linha 1: 1 -> 2 -> 3 -->
  <g>
    <rect x="40" y="30" width="330" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="205" y="98" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827"><tspan x="205">1. Identificação do</tspan><tspan x="205" dy="28">problema e motivação</tspan></text>
  </g>
  <g>
    <rect x="435" y="30" width="330" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="98" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827"><tspan x="600">2. Definição dos</tspan><tspan x="600" dy="28">objetivos da solução</tspan></text>
  </g>
  <g>
    <rect x="830" y="30" width="330" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="995" y="78" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827"><tspan x="995">3. Projeto e</tspan><tspan x="995" dy="28">desenvolvimento</tspan></text>
    <text x="995" y="138" text-anchor="middle" font-size="18" fill="#374151"><tspan x="995">sistema e base de conhecimento,</tspan><tspan x="995" dy="22">reformulados após a avaliação</tspan></text>
  </g>
  <line x1="370" y1="105" x2="433" y2="105" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="765" y1="105" x2="828" y2="105" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- 3 -> 4 -->
  <line x1="995" y1="180" x2="995" y2="268" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- Linha 2 (da direita para a esquerda): 4 -> 5 -> 6 -->
  <g>
    <rect x="830" y="270" width="330" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="995" y="335" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">4. Demonstração</text>
    <text x="995" y="369" text-anchor="middle" font-size="18" fill="#374151">uso do protótipo web</text>
  </g>
  <g>
    <rect x="435" y="270" width="330" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="335" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">5. Avaliação</text>
    <text x="600" y="369" text-anchor="middle" font-size="18" fill="#374151">técnica e experimental</text>
  </g>
  <g>
    <rect x="40" y="270" width="330" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="205" y="335" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">6. Comunicação</text>
    <text x="205" y="369" text-anchor="middle" font-size="18" fill="#374151">esta monografia</text>
  </g>
  <line x1="830" y1="345" x2="767" y2="345" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="435" y1="345" x2="372" y2="345" stroke="#1f2937" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- Iteração: 5 -> 2 -->
  <line x1="600" y1="270" x2="600" y2="183" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#seta-cinza)"/>
  <text x="612" y="232" font-size="19" font-style="italic" fill="#4b5563">iteração</text>
</svg>
