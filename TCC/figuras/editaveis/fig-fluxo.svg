<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2030" viewBox="0 0 1200 2030" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1200" height="2030" fill="#ffffff"/>

  <g font-size="19" fill="#111827" text-anchor="middle">
    <!-- Início -->
    <rect x="320" y="20" width="560" height="60" rx="30" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
    <text x="600" y="57">Pergunta recebida pela rota POST /api/chat/ask</text>
    <line x1="600" y1="80" x2="600" y2="118" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Decisão: sessão de login -->
    <polygon points="600,120 790,175 600,230 410,175" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="169">Sessão de login</text>
    <text x="600" y="192">válida?</text>
    <line x1="790" y1="175" x2="868" y2="175" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
    <text x="828" y="162" font-size="17">Não</text>
    <rect x="870" y="135" width="310" height="80" rx="4" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
    <text x="1025" y="169" fill="#8a5410" font-weight="bold">Responder 401</text>
    <text x="1025" y="195" font-size="17" fill="#374151">(não autenticado)</text>
    <text x="616" y="256" font-size="17" text-anchor="start">Sim</text>
    <line x1="600" y1="230" x2="600" y2="288" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="290" width="560" height="84" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="324">Abrir ou retomar a conversa, ler as mensagens</text>
    <text x="600" y="352">recentes e registrar a pergunta</text>
    <line x1="600" y1="374" x2="600" y2="412" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="414" width="560" height="110" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="448">Interpretar a pergunta no contexto da conversa</text>
    <text x="600" y="478" font-size="17" fill="#374151">modelo de linguagem (JSON) ou análise local:</text>
    <text x="600" y="502" font-size="17" fill="#374151">pergunta autônoma, consultas de busca e domínio</text>
    <line x1="600" y1="524" x2="600" y2="562" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="564" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="601">Classificar a intenção e estimar o risco clínico</text>
    <line x1="600" y1="624" x2="600" y2="662" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Decisão: fora do escopo -->
    <polygon points="600,664 770,719 600,774 430,719" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="726">Fora do escopo?</text>
    <line x1="770" y1="719" x2="1040" y2="719" stroke="#1f2937" stroke-width="2"/>
    <text x="900" y="706" font-size="17">Sim: busca não executada</text>
    <text x="616" y="800" font-size="17" text-anchor="start">Não</text>
    <line x1="600" y1="774" x2="600" y2="822" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="824" width="560" height="110" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="858">Busca híbrida</text>
    <text x="600" y="888" font-size="17" fill="#374151">uma lista vetorial por consulta (top-K = 20) e uma</text>
    <text x="600" y="912" font-size="17" fill="#374151">lista textual, combinadas por posição recíproca (RRF)</text>
    <line x1="600" y1="934" x2="600" y2="972" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="974" width="560" height="110" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="1008">Verificar a evidência e, se insuficiente,</text>
    <text x="600" y="1036">repetir a busca de forma ampliada</text>
    <text x="600" y="1066" font-size="17" fill="#374151">com evidência: até 8 trechos com apoio (top-N)</text>
    <line x1="600" y1="1084" x2="600" y2="1172" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Retorno do ramo fora do escopo -->
    <line x1="1040" y1="719" x2="1040" y2="1128" stroke="#1f2937" stroke-width="2"/>
    <line x1="1040" y1="1128" x2="603" y2="1128" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Decisão: regras de segurança -->
    <polygon points="600,1174 800,1231 600,1288 400,1231" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="1224">Alguma regra de</text>
    <text x="600" y="1248">segurança é acionada?</text>
    <line x1="400" y1="1231" x2="332" y2="1231" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
    <text x="366" y="1218" font-size="17">Sim</text>
    <text x="616" y="1310" font-size="17" text-anchor="start">Não</text>
    <line x1="600" y1="1288" x2="600" y2="1329" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Recusa -->
    <rect x="20" y="1120" width="310" height="330" rx="4" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
    <text x="175" y="1154" font-weight="bold" fill="#8a5410">Recusa com</text>
    <text x="175" y="1178" font-weight="bold" fill="#8a5410">mensagem fixa</text>
    <line x1="40" y1="1194" x2="310" y2="1194" stroke="#8a5410" stroke-width="1"/>
    <g font-size="16" text-anchor="start" fill="#111827">
      <text x="40" y="1218" font-style="italic" fill="#4b5563">Regras, na ordem de avaliação:</text>
      <text x="40" y="1244">1. fora do escopo</text>
      <text x="40" y="1268">2. urgência relatada (paciente)</text>
      <text x="40" y="1292">3. diagnóstico de caso específico</text>
      <text x="40" y="1316">4. prescrição individual</text>
      <text x="40" y="1340">5. dose ou troca de</text>
      <text x="58" y="1362">medicamento (paciente)</text>
      <text x="40" y="1386">6. evidência insuficiente</text>
      <text x="40" y="1424" font-size="14" font-style="italic" fill="#4b5563">gestação, crianças e reações:</text>
      <text x="40" y="1442" font-size="14" font-style="italic" fill="#4b5563">respondidas com cuidados</text>
    </g>

    <!-- Decisão: chave da OpenAI -->
    <polygon points="600,1331 790,1386 600,1441 410,1386" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="1380">Chave da OpenAI</text>
    <text x="600" y="1403">configurada?</text>
    <line x1="790" y1="1386" x2="868" y2="1386" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
    <text x="828" y="1373" font-size="17">Não</text>
    <text x="616" y="1464" font-size="17" text-anchor="start">Sim</text>
    <line x1="600" y1="1441" x2="600" y2="1484" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="870" y="1346" width="310" height="80" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="1025" y="1380">Resposta extrativa com</text>
    <text x="1025" y="1406">os trechos e as fontes</text>

    <rect x="320" y="1486" width="560" height="84" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="1520">Gerar a resposta com o modelo de linguagem</text>
    <text x="600" y="1550" font-size="17" fill="#374151">(gpt-6-luna), com citações numeradas aos trechos</text>
    <line x1="600" y1="1570" x2="600" y2="1608" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="1610" width="560" height="84" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="1644">Renumerar e verificar as citações</text>
    <text x="600" y="1674" font-size="17" fill="#374151">fontes: apenas os trechos citados na resposta</text>
    <line x1="600" y1="1694" x2="600" y2="1732" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Convergência -->
    <line x1="175" y1="1450" x2="175" y2="1764" stroke="#1f2937" stroke-width="2"/>
    <line x1="175" y1="1764" x2="318" y2="1764" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
    <line x1="1025" y1="1426" x2="1025" y2="1764" stroke="#1f2937" stroke-width="2"/>
    <line x1="1025" y1="1764" x2="882" y2="1764" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="1734" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="1771">Anexar o aviso de apoio informacional</text>
    <line x1="600" y1="1794" x2="600" y2="1832" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="1834" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="1871">Registrar a resposta e o log de recuperação</text>
    <line x1="600" y1="1894" x2="600" y2="1932" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Fim -->
    <rect x="240" y="1934" width="720" height="64" rx="32" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
    <text x="600" y="1960" font-size="18">Devolver a resposta, as fontes documentais, as informações</text>
    <text x="600" y="1984" font-size="18">de segurança e o resumo da recuperação</text>
  </g>
</svg>
