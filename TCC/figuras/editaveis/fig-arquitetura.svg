<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1400" height="790" fill="#ffffff"/>

  <!-- Navegador -->
  <rect x="20" y="20" width="360" height="750" rx="8" fill="#f8fafa" stroke="#1f2937" stroke-width="2"/>
  <text x="40" y="54" font-size="22" font-weight="bold" fill="#111827">Navegador</text>
  <text x="40" y="84" font-size="18" fill="#111827">Interface web</text>
  <text x="40" y="108" font-size="16" fill="#4b5563">React · TypeScript · Vite</text>

  <rect x="40" y="130" width="320" height="300" rx="6" fill="#ffffff" stroke="#0e5c66" stroke-width="2"/>
  <rect x="40" y="130" width="320" height="42" rx="6" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
  <text x="200" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#0e5c66">Área pública</text>
  <g font-size="16" fill="#111827">
    <text x="60" y="206">• Página inicial</text>
    <text x="60" y="240">• Tela de login</text>
    <text x="60" y="274">• Gaveta de consulta*</text>
    <text x="78" y="296" font-size="14" fill="#4b5563" font-style="italic">com avaliação de 0 a 10</text>
    <text x="78" y="316" font-size="14" fill="#4b5563" font-style="italic">após cada resposta</text>
    <text x="60" y="350">• Tela de comparação*</text>
    <text x="78" y="372" font-size="14" fill="#4b5563" font-style="italic">(resposta sem RAG simulada</text>
    <text x="78" y="392" font-size="14" fill="#4b5563" font-style="italic">no próprio navegador)</text>
  </g>

  <rect x="40" y="450" width="320" height="270" rx="6" fill="#ffffff" stroke="#0e5c66" stroke-width="2"/>
  <rect x="40" y="450" width="320" height="42" rx="6" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
  <text x="200" y="478" text-anchor="middle" font-size="18" font-weight="bold" fill="#0e5c66">Painel interno*</text>
  <g font-size="16" fill="#111827">
    <text x="60" y="524">• Consulta com seleção de perfil</text>
    <text x="78" y="546" font-size="14" fill="#4b5563" font-style="italic">e avaliação das respostas</text>
    <text x="60" y="580">• Explorador de recuperação</text>
    <text x="60" y="614">• Navegador da base</text>
    <text x="78" y="636" font-size="14" fill="#4b5563" font-style="italic">de conhecimento</text>
    <text x="60" y="670">• Painel de avaliação</text>
    <text x="78" y="692" font-size="14" fill="#4b5563" font-style="italic">(perguntas de referência)</text>
  </g>
  <text x="40" y="748" font-size="14" font-style="italic" fill="#4b5563">* exige login</text>

  <!-- Navegador <-> Servidor -->
  <line x1="382" y1="400" x2="468" y2="400" stroke="#1f2937" stroke-width="2.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="425" y="366" text-anchor="middle" font-size="15" fill="#111827">HTTP</text>
  <text x="425" y="386" text-anchor="middle" font-size="15" fill="#111827">JSON</text>
  <text x="425" y="424" text-anchor="middle" font-size="14" fill="#374151">cookie de</text>
  <text x="425" y="442" text-anchor="middle" font-size="14" fill="#374151">sessão</text>

  <!-- Servidor -->
  <rect x="470" y="20" width="540" height="750" rx="8" fill="#f8fafa" stroke="#1f2937" stroke-width="2"/>
  <text x="490" y="54" font-size="22" font-weight="bold" fill="#111827">Servidor da API</text>
  <text x="490" y="84" font-size="16" fill="#4b5563">Node.js · TypeScript · Express</text>

  <rect x="490" y="104" width="500" height="44" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="740" y="132" text-anchor="middle" font-size="17" fill="#111827">Rotas e controladores (prefixo /api)</text>

  <rect x="490" y="158" width="500" height="58" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
  <text x="740" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Autenticação <tspan font-size="14" font-weight="normal" fill="#4b5563">auth</tspan></text>
  <text x="740" y="205" text-anchor="middle" font-size="14" fill="#374151">login, sessão em cookie e exigência de login em /api</text>

  <text x="490" y="246" font-size="15" font-weight="bold" fill="#4b5563">MÓDULOS DE DOMÍNIO</text>
  <g font-size="17" fill="#111827" text-anchor="middle">
    <rect x="490" y="258" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="612" y="280" font-weight="bold">Base de conhecimento</text>
    <text x="612" y="301" font-size="14" fill="#4b5563">knowledge</text>
    <rect x="745" y="258" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="867" y="280" font-weight="bold">Trechos</text>
    <text x="867" y="301" font-size="14" fill="#4b5563">chunks</text>

    <rect x="490" y="320" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="612" y="342" font-weight="bold">Embeddings</text>
    <text x="612" y="363" font-size="14" fill="#4b5563">embeddings</text>
    <rect x="745" y="320" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="867" y="342" font-weight="bold">Recuperação</text>
    <text x="867" y="363" font-size="14" fill="#4b5563">retrieval</text>

    <rect x="490" y="382" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="612" y="404" font-weight="bold">Segurança</text>
    <text x="612" y="425" font-size="14" fill="#4b5563">safety</text>
    <rect x="745" y="382" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="867" y="404" font-weight="bold">Consulta</text>
    <text x="867" y="425" font-size="14" fill="#4b5563">chat</text>

    <rect x="490" y="444" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="612" y="466" font-weight="bold">Avaliação técnica</text>
    <text x="612" y="487" font-size="14" fill="#4b5563">evaluation</text>
    <rect x="745" y="444" width="245" height="52" rx="5" fill="#ffffff" stroke="#0e5c66" stroke-width="1.5"/>
    <text x="867" y="466" font-weight="bold">Avaliação das respostas</text>
    <text x="867" y="487" font-size="14" fill="#4b5563">feedback</text>
  </g>

  <rect x="490" y="514" width="500" height="44" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="740" y="542" text-anchor="middle" font-size="17" fill="#111827">Composição das dependências (services.ts)</text>

  <rect x="490" y="576" width="500" height="68" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="740" y="604" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Acesso a dados</text>
  <text x="740" y="629" text-anchor="middle" font-size="15" fill="#374151">Prisma e SQL direto (pgvector e busca textual)</text>

  <rect x="490" y="672" width="500" height="74" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="740" y="702" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">Modo local, sem chave da OpenAI</text>
  <text x="740" y="727" text-anchor="middle" font-size="15" fill="#374151">embeddings determinísticos, análise local e resposta extrativa</text>

  <!-- Servidor <-> PostgreSQL -->
  <line x1="1012" y1="610" x2="1108" y2="610" stroke="#1f2937" stroke-width="2.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="1060" y="596" text-anchor="middle" font-size="15" fill="#111827">SQL</text>

  <!-- PostgreSQL -->
  <rect x="1110" y="300" width="270" height="470" rx="8" fill="#f8fafa" stroke="#1f2937" stroke-width="2"/>
  <text x="1245" y="336" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">PostgreSQL</text>
  <text x="1245" y="362" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">com pgvector</text>
  <text x="1245" y="388" text-anchor="middle" font-size="15" fill="#4b5563">Docker local ou Neon (publicação)</text>
  <g font-size="16" fill="#111827">
    <text x="1130" y="440">• 11 tabelas</text>
    <text x="1148" y="462" font-size="14" fill="#4b5563">(documentos, ingestões, trechos,</text>
    <text x="1148" y="482" font-size="14" fill="#4b5563">usuários, conversas e avaliações)</text>
    <text x="1130" y="522">• índice HNSW</text>
    <text x="1148" y="544" font-size="14" fill="#4b5563">(distância de cosseno)</text>
    <text x="1130" y="584">• índices GIN</text>
    <text x="1148" y="606" font-size="14" fill="#4b5563">(texto sem acentos e metadados)</text>
    <text x="1130" y="646">• vetores de 1.536</text>
    <text x="1148" y="668" font-size="14" fill="#4b5563">dimensões por trecho</text>
    <text x="1130" y="708">• restrições CHECK</text>
    <text x="1148" y="730" font-size="14" fill="#4b5563">(nota, comentário, usuário</text>
    <text x="1148" y="750" font-size="14" fill="#4b5563">e formato do hash da senha)</text>
  </g>

  <!-- Servidor -> OpenAI -->
  <line x1="1012" y1="110" x2="1108" y2="110" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#seta)"/>
  <text x="1060" y="96" text-anchor="middle" font-size="15" fill="#111827">HTTPS</text>

  <!-- OpenAI -->
  <rect x="1110" y="20" width="270" height="250" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="1245" y="54" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">API da OpenAI</text>
  <text x="1245" y="78" text-anchor="middle" font-size="15" fill="#4b5563">opcional</text>
  <g font-size="16" fill="#111827">
    <text x="1130" y="118">• Embeddings:</text>
    <text x="1148" y="140" font-size="15" fill="#374151">text-embedding-3-small</text>
    <text x="1130" y="178">• Análise e geração:</text>
    <text x="1148" y="200" font-size="15" fill="#374151">gpt-6-luna</text>
  </g>
  <text x="1245" y="246" text-anchor="middle" font-size="14" font-style="italic" fill="#4b5563">usada quando há chave configurada</text>
</svg>
