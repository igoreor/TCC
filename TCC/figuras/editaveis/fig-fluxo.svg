<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1894" viewBox="0 0 1200 1894" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1200" height="1894" fill="#ffffff"/>

  <g font-size="19" fill="#111827" text-anchor="middle">
    <!-- Início -->
    <rect x="320" y="20" width="560" height="60" rx="30" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
    <text x="600" y="57">Pergunta recebida pela rota POST /api/chat/ask</text>
    <line x1="600" y1="80" x2="600" y2="118" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <!-- Decisão: sessão de login -->
    <polygon points="600,120 790,175 600,230 410,175" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="169">Sessão de login</text>
    <text x="600" y="192">válida?</text>
    <line x1="790" y1="175" x2="868" y2="175" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
    <text x="828" y="162" font-size="17">Não</text>
    <rect x="870" y="135" width="310" height="80" rx="4" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
    <text x="1025" y="169" fill="#8a5410" font-weight="bold">Responder 401</text>
    <text x="1025" y="195" font-size="17" fill="#374151">(não autenticado)</text>
    <text x="616" y="256" font-size="17" text-anchor="start">Sim</text>
    <line x1="600" y1="230" x2="600" y2="288" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="320" y="290" width="560" height="84" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="600" y="324">Abrir ou retomar a conversa do usuário</text>
    <text x="600" y="352">e registrar a pergunta</text>
    <line x1="600" y1="374" x2="600" y2="412" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>

    <g transform="translate(0,194)">
      <rect x="320" y="220" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="257">Classificar a intenção por palavras-chave</text>
      <line x1="600" y1="280" x2="600" y2="318" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <!-- Decisão: fora de escopo -->
      <polygon points="600,320 770,375 600,430 430,375" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="382">Fora de escopo?</text>
      <line x1="770" y1="375" x2="1040" y2="375" stroke="#1f2937" stroke-width="2"/>
      <text x="900" y="362" font-size="17">Sim: busca não executada</text>
      <text x="616" y="456" font-size="17" text-anchor="start">Não</text>
      <line x1="600" y1="430" x2="600" y2="478" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <rect x="320" y="480" width="560" height="84" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="514">Busca híbrida: vetorial (top-K = 12) e textual</text>
      <text x="600" y="544">s<tspan font-size="14" dy="5">final</tspan><tspan dy="-5"> = 0,65 · s</tspan><tspan font-size="14" dy="5">vet</tspan><tspan dy="-5"> + 0,35 · s</tspan><tspan font-size="14" dy="5">txt</tspan></text>
      <line x1="600" y1="564" x2="600" y2="598" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <rect x="320" y="600" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="637">Estimar o risco clínico (quatro níveis)</text>
      <line x1="600" y1="660" x2="600" y2="698" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <rect x="320" y="700" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="737">Reordenar os candidatos por critérios clínicos</text>
      <line x1="600" y1="760" x2="600" y2="798" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <rect x="320" y="800" width="560" height="84" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="834">Aplicar o limiar de relevância (0,65; triagem: 0,45)</text>
      <text x="600" y="864" font-size="17" fill="#374151">atingido: 5 primeiros trechos (top-N); não atingido: nenhum</text>
      <line x1="600" y1="884" x2="600" y2="976" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <!-- Retorno do ramo fora de escopo -->
      <line x1="1040" y1="375" x2="1040" y2="930" stroke="#1f2937" stroke-width="2"/>
      <line x1="1040" y1="930" x2="603" y2="930" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <!-- Decisão: regras de segurança -->
      <polygon points="600,978 800,1035 600,1092 400,1035" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="1028">Alguma regra de</text>
      <text x="600" y="1052">segurança é acionada?</text>
      <line x1="400" y1="1035" x2="332" y2="1035" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
      <text x="366" y="1022" font-size="17">Sim</text>
      <text x="616" y="1114" font-size="17" text-anchor="start">Não</text>
      <line x1="600" y1="1092" x2="600" y2="1133" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <!-- Recusa -->
      <rect x="20" y="950" width="310" height="300" rx="4" fill="#f6ecdc" stroke="#8a5410" stroke-width="2"/>
      <text x="175" y="984" font-weight="bold" fill="#8a5410">Recusa com</text>
      <text x="175" y="1008" font-weight="bold" fill="#8a5410">mensagem fixa</text>
      <line x1="40" y1="1024" x2="310" y2="1024" stroke="#8a5410" stroke-width="1"/>
      <g font-size="16" text-anchor="start" fill="#111827">
        <text x="40" y="1048" font-style="italic" fill="#4b5563">Regras, na ordem de avaliação:</text>
        <text x="40" y="1072">1. fora de escopo</text>
        <text x="40" y="1094">2. gestação</text>
        <text x="40" y="1116">3. crianças</text>
        <text x="40" y="1138">4. sinais de urgência</text>
        <text x="40" y="1160">5. reação grave</text>
        <text x="40" y="1182">6. diagnóstico definitivo</text>
        <text x="40" y="1204">7. prescrição ou dose</text>
        <text x="40" y="1226">8. evidência insuficiente</text>
      </g>
  
      <!-- Decisão: chave da OpenAI -->
      <polygon points="600,1135 790,1190 600,1245 410,1190" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="1184">Chave da OpenAI</text>
      <text x="600" y="1207">configurada?</text>
      <line x1="790" y1="1190" x2="868" y2="1190" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
      <text x="828" y="1177" font-size="17">Não</text>
      <text x="616" y="1268" font-size="17" text-anchor="start">Sim</text>
      <line x1="600" y1="1245" x2="600" y2="1288" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <rect x="870" y="1150" width="310" height="80" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="1025" y="1184">Resposta extrativa com</text>
      <text x="1025" y="1210">os trechos e as fontes</text>
  
      <rect x="320" y="1290" width="560" height="84" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="1324">Gerar a resposta com o modelo de linguagem</text>
      <text x="600" y="1354" font-size="17" fill="#374151">a partir dos trechos (gpt-4o-mini, temperatura 0,1)</text>
      <line x1="600" y1="1374" x2="600" y2="1418" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <!-- Convergência -->
      <line x1="175" y1="1250" x2="175" y2="1450" stroke="#1f2937" stroke-width="2"/>
      <line x1="175" y1="1450" x2="318" y2="1450" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
      <line x1="1025" y1="1230" x2="1025" y2="1450" stroke="#1f2937" stroke-width="2"/>
      <line x1="1025" y1="1450" x2="882" y2="1450" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <rect x="320" y="1420" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="1457">Anexar o aviso de apoio informacional</text>
      <line x1="600" y1="1480" x2="600" y2="1518" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <rect x="320" y="1520" width="560" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="600" y="1557">Registrar a resposta e o log de recuperação</text>
      <line x1="600" y1="1580" x2="600" y2="1618" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
  
      <!-- Fim -->
      <rect x="270" y="1620" width="660" height="64" rx="32" fill="#e3eeee" stroke="#0e5c66" stroke-width="2"/>
      <text x="600" y="1646" font-size="18">Devolver a resposta, as fontes, as informações</text>
      <text x="600" y="1670" font-size="18">de segurança e o resumo da recuperação</text>
      </g>
  </g>
</svg>
